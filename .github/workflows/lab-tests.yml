# 수학 랩 자동 테스트: PR 을 열거나 고칠 때마다 tests/ 의 스모크 테스트 전체를 헤드리스 크로미움으로 돌린다.
# 결과는 PR 화면 아래 "Checks" 에 ✅/❌ 로 표시된다. ❌ 면 merge 전에 Claude 에게 "PR 테스트 실패 고쳐줘" 라고 하면 된다.
name: 수학 랩 테스트

on:
  pull_request:
    paths: ['lab/**', 'tests/**', 'tools/**', '.github/workflows/lab-tests.yml']
  workflow_dispatch:

concurrency:
  group: lab-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: 테스트 의존성 설치
        working-directory: tests
        run: npm ci
      - name: 크로미움·한글 글꼴 설치
        working-directory: tests
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: 스모크 테스트 전체 (node run-all.js)
        working-directory: tests
        run: node run-all.js
