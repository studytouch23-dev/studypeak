<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스터디피크 국어 랩</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* 국어 랩의 색: 깊은 네이비 + 은은한 금색 포인트 (수학 랩의 초록과 구별) */
:root{
  --brand:#2a4a82; --brand-2:#1c3260; --brand-3:#12213f; --brand-50:#f2f5fb; --brand-100:#e3eaf6; --brand-200:#c5d2ea;
  --gold:#b08d57; --gold-soft:#f6efe3; --ok:#0f766e; --ok-bg:#ecfdf5;
  --bg:#f3f5f9; --card:#fff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --line:#e2e8f0; --line-2:#f1f4f8;
  --danger:#dc2626; --warn:#b45309; --warn-bg:#fef3c7; --mark:#fde68a; --sbw:236px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55;letter-spacing:-.01em;font-size:15px}
button{font-family:inherit;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font-family:inherit;font-size:.93rem;border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(42,74,130,.18)}
label{font-size:.8rem;font-weight:700;color:var(--ink-2);display:block;margin-bottom:.3rem}
h2{font-size:1.45rem;margin:0 0 .3rem;letter-spacing:-.03em;color:var(--brand-3)}
h3{font-size:1rem;margin:0 0 .6rem}
.vd{color:var(--muted);margin:0 0 1.1rem;font-size:.93rem}
.hint{color:var(--muted);font-size:.82rem}
#layout{display:flex;min-height:100vh}
#sidebar{width:var(--sbw);flex:0 0 var(--sbw);background:linear-gradient(180deg,#16284d 0%,#0f1c38 100%);color:#dbe3f1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#sidebar .brand{padding:1.15rem 1.2rem;font-weight:800;display:flex;gap:.65rem;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
#sidebar .logo{background:linear-gradient(135deg,#d2b37c,#a8834b);color:#12213f;font-weight:800;border-radius:10px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
#sidebar .brand small{display:block;font-size:.64rem;color:#c9a96e;letter-spacing:.16em;font-weight:700}
#sbnav{padding:.7rem .6rem;display:flex;flex-direction:column;gap:2px}
#sbnav button{background:none;border:0;text-align:left;padding:.58rem .8rem;border-radius:10px;font-size:.93rem;color:#c3cde0;display:flex;align-items:center;gap:.5rem;border-left:3px solid transparent}
#sbnav button:hover{background:rgba(255,255,255,.06);color:#fff}
#sbnav button.active{background:rgba(255,255,255,.1);color:#fff;font-weight:700;border-left-color:#c9a96e}
#sbnav .soon{margin-left:auto;font-size:.66rem;background:rgba(255,255,255,.1);color:#9fb0cc;border-radius:99px;padding:0 .45rem}
#sbnav .cnt{margin-left:auto;font-size:.7rem;background:rgba(255,255,255,.12);color:#e8eefb;border-radius:99px;padding:0 .45rem;font-weight:700}
#sbnav button.active .cnt{background:rgba(255,255,255,.25);color:#fff}
#sidebar .sb-foot{margin-top:auto;padding:1rem 1.2rem;font-size:.74rem;color:#8fa0bd;border-top:1px solid rgba(255,255,255,.08)}
#sidebar .sb-foot a{color:#c9a96e;font-weight:700}
#mainwrap{flex:1;min-width:0}
#topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.8rem 1.6rem;font-weight:700;color:var(--brand-3);display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:5}
#menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:.2rem .5rem}
main{padding:1.6rem;max-width:1240px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.15rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:.6rem;align-items:center;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem}
.btn{border:1px solid transparent;border-radius:10px;padding:.5rem .95rem;font-weight:700;font-size:.88rem;background:var(--brand-2);color:#fff}
.btn:hover{background:var(--brand-3)}
.btn.ghost{background:#fff;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{background:#fff;color:var(--danger);border-color:#fecaca}
.btn.sm{padding:.28rem .6rem;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:.05rem .55rem;font-size:.76rem;color:var(--ink-2);background:#fff;white-space:nowrap}
.chip.g{background:var(--brand-100);border-color:transparent;color:var(--brand-3);font-weight:700}
.chip.w{background:var(--warn-bg);border-color:transparent;color:var(--warn);font-weight:700}
.chip.clk{cursor:pointer}.chip.on{background:var(--brand-2);color:#fff;border-color:transparent;font-weight:700}
.stat{display:flex;flex-direction:column;gap:.1rem}.stat b{font-size:1.7rem;line-height:1.1}
.empty{text-align:center;color:var(--muted);padding:2.2rem 1rem}
/* 지문·문항 */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;min-width:0}
.pcard:hover{border-color:var(--brand)}
.pcard b{font-size:.98rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .ex{color:var(--muted);font-size:.8rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.split{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:1rem;align-items:start}
.passage{font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;font-size:.97rem;line-height:1.95;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.passage .pl,.ktext .pl{margin:0}
.passage .pl.prose{text-indent:1em}
.ktext u,.passage u{text-underline-offset:3px}
.bx{border:1px solid var(--ink-2);padding:0 .2em;border-radius:2px}
/* [A] 구간 괄호: 왼쪽 세로선 + 위아래 짧은 가로선, 이름은 선 가운데에 */
.brk{position:relative;margin:.1em 0 .1em 1.9em;padding-left:.75em;border-left:1.5px solid currentColor}
.brk::before,.brk::after{content:"";position:absolute;left:0;width:.5em;border-top:1.5px solid currentColor}
.brk::before{top:0}.brk::after{bottom:0}
.brk>.brl{position:absolute;left:-1.25em;top:50%;transform:translate(-50%,-50%);background:var(--card,#fff);padding:.15em .1em;font-family:"Pretendard Variable",sans-serif;font-weight:700;font-size:.82em;line-height:1;text-indent:0;white-space:nowrap}
.brk .pl.prose.cont,.pl.prose.cont{text-indent:0}
.figph{display:inline-block;background:var(--line-2);border:1px dashed #cbd5e1;border-radius:8px;padding:.1rem .6rem;font-size:.78rem;color:var(--muted);font-family:"Pretendard Variable",sans-serif;text-indent:0}
.uq{color:#fff;background:var(--danger);border-radius:99px;font-size:.62em;font-weight:800;padding:0 .38em;margin-left:.1em;vertical-align:.35em;font-family:"Pretendard Variable",sans-serif;text-indent:0}
.jm{color:var(--warn);font-weight:800;font-family:"Pretendard Variable",sans-serif}
.qitem{border-top:1px solid var(--line);padding:.85rem 0}
.qitem:first-child{border-top:0;padding-top:0}
.qitem .stem{font-weight:600}
.qitem .view{border:1px solid var(--ink-2);border-radius:4px;padding:.55rem .7rem;margin:.5rem 0;font-size:.92rem;position:relative}
.qitem .view .vl{position:absolute;top:-.7em;left:50%;transform:translateX(-50%);background:#fff;padding:0 .5em;font-size:.78rem;font-weight:700}
.qitem .ch{display:block;padding:.1rem .3rem;border-radius:6px}
.qitem .ch.ans{background:var(--brand-50);font-weight:600}
.qitem .exp{background:var(--line-2);border-radius:10px;padding:.6rem .8rem;margin-top:.5rem;font-size:.86rem;color:var(--ink-2)}
.orig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:.4rem 0}
details.pv{border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem;margin-bottom:.5rem;background:#fff}
details.pv summary{cursor:pointer;font-weight:700}
details.pv[open] summary{margin-bottom:.5rem}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:.6rem .8rem;font-size:.86rem;margin:.6rem 0}
/* 유형 · 근거 형광펜 · 표 */
.chip.t{background:#eef2ff;border-color:transparent;color:#3730a3;font-weight:700}.chip i{font-style:normal;font-weight:500;opacity:.7;margin-left:.35em}
mark.ev{color:inherit;border-radius:3px;padding:.05em 0;transition:opacity .15s}mark.ev.dim,sup.evn.dim{opacity:.18}
.ev1{background:#fde68a}.ev2{background:#bbf7d0}.ev3{background:#fbcfe8}.ev4{background:#bfdbfe}.ev5{background:#fed7aa}.ev6{background:#ddd6fe}.ev7{background:#99f6e4}.ev8{background:#d9f99d}
sup.evn{font-family:"Pretendard Variable",sans-serif;font-size:.62rem;font-weight:800;border-radius:99px;padding:0 .38em;margin-right:.15em;color:#111827;text-indent:0;vertical-align:.5em;line-height:1}
.evdot{border:0;border-radius:99px;padding:.1rem .55rem;font-size:.72rem;font-weight:800;color:#111827;cursor:pointer}
.qitem .ch.ev{font-weight:600}
.xw{color:var(--danger);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.toolbar{padding:.7rem 1rem}
.tblwrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:.84rem}
.tbl th{text-align:left;background:var(--line-2);padding:.4rem .5rem;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:.3rem .45rem;border-top:1px solid var(--line-2);vertical-align:top}
.tbl tr.gfirst td{border-top:2px solid var(--line)}
.tbl select,.tbl input{padding:.25rem .35rem;font-size:.82rem;width:auto;max-width:260px}
.tbl td.rule select{background:var(--warn-bg)}
.errbox{background:#fef2f2;border-color:#fecaca;color:#991b1b;font-size:.88rem}.okbox{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-size:.88rem}
.errbox ul,.warnbox ul{margin:.3rem 0 0 1.1rem}
.pick{display:block;font-weight:400;padding:.25rem .2rem;border-radius:8px;cursor:pointer}.pick:hover{background:var(--line-2)}.pick input{width:auto;margin-right:.3rem}
.vres{border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:.6rem}.vres.fail{border-color:#fecaca}.vres.warn{border-color:#fde68a}
/* 출력물 (화면 미리보기와 인쇄가 같은 모양) — 본문은 시험지처럼 명조·양쪽 맞춤, 머리말·표는 네이비 */
.sheet{--nv:#1c3260;--nv2:#12213f;--gd:#b08d57;font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;font-size:10.3pt;line-height:1.78;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .shd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2.5px solid var(--nv);padding-bottom:6px;margin-bottom:3px;font-family:"Pretendard Variable",sans-serif;position:relative}
.sheet .shd::after{content:"";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid var(--gd)}
.sheet .shd b{font-size:15pt;color:var(--nv2);letter-spacing:-.02em}.sheet .shk{font-size:7.5pt;font-weight:800;letter-spacing:.18em;color:var(--gd)}.sheet .shs{font-size:9pt;color:#333;white-space:nowrap}
.sheet .xhd{text-align:center;border-bottom:2.5px solid #000;padding-bottom:8px;font-family:"Pretendard Variable",sans-serif}
.sheet .xsub{font-size:10pt;font-weight:700}.sheet .xtitle{font-size:22pt;font-weight:800;letter-spacing:.35em;margin:2px 0 6px;color:var(--nv2)}
.sheet .xinfo{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:9pt}.sheet .xinfo i{display:inline-block;border:1px solid #000;height:20px;width:90px}.sheet .xinfo i.w{width:150px}
.sheet .xend{margin-top:10px;border-top:1px solid #000;padding-top:4px;font-family:"Pretendard Variable",sans-serif;font-size:8.5pt}
.sheet .sbody{margin-top:14px}
.sheet.exam .sbody{column-count:2;column-gap:24px;column-rule:1px solid #000}
.sheet.work .sset,.sheet.book .sset{column-count:2;column-gap:22px;column-rule:1px solid #c5d2ea;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--nv)}
.sheet.exam .sset{margin-bottom:14px}.sheet .sset.single{border-bottom-style:dashed}
.sheet .shead{font-family:"Pretendard Variable",sans-serif;font-weight:700;margin-bottom:5px}.sheet .shead b{color:var(--nv)}
.sheet .spassage{border:1px solid #000;padding:7px 10px;margin-bottom:10px}.sheet .spassage .pl{margin:0}.sheet .spassage .pl.prose{text-indent:1em;text-align:justify}.sheet .spassage .pl.prose.cont{text-indent:0}
.sheet .sq{break-inside:avoid;margin:0 0 12px}.sheet .sstem{padding-left:1.5em;text-indent:-1.5em;font-weight:600}.sheet .sch{padding-left:2.4em;text-indent:-1.3em}
.sheet .sview{border:1px solid #000;margin:6px 0 6px 1em;padding:9px 8px 5px;position:relative;font-size:9.7pt}.sheet .svl{position:absolute;top:-.8em;left:50%;transform:translateX(-50%);background:#fff;padding:0 .5em;font-size:9pt}.sheet .sview .pl{margin:0}
.sheet .slines{height:6.5em;margin:6px 0 0 1em;background:repeating-linear-gradient(#fff,#fff 1.55em,#999 1.55em,#999 calc(1.55em + 1px))}
.sheet .simg img{max-width:100%;display:block;margin:3px 0}.sheet .sox{font-weight:400;white-space:nowrap}.sheet .sorig{font-family:"Pretendard Variable",sans-serif;font-size:8pt;color:#666;font-weight:400}
.sheet .bx{border:1px solid #000}.sheet u{text-underline-offset:3px}.sheet .brk>.brl{background:#fff}
/* 정답·해설지 / 교재의 해설 */
.sheet.ans,.sheet .ssol{font-family:"Pretendard Variable",sans-serif;font-size:9.4pt;line-height:1.6}
.sheet .qh{font-family:"Pretendard Variable",sans-serif;font-size:10.5pt;color:var(--nv2);margin:14px 0 6px;padding-left:8px;border-left:4px solid var(--gd)}
.sheet .quick{display:grid;grid-template-columns:repeat(10,1fr);gap:0;border-top:1px solid var(--nv);border-left:1px solid var(--nv)}
.sheet .quick span{display:flex;flex-direction:column;text-align:center;border-right:1px solid var(--nv);border-bottom:1px solid var(--nv)}
.sheet .quick i{font-style:normal;font-size:8pt;background:var(--nv);color:#fff;font-weight:700}.sheet .quick b{font-size:11pt;padding:2px 0}
.sheet .aset{margin-bottom:10px}.sheet .aseth{background:#e3eaf6;color:var(--nv2);font-weight:800;padding:3px 8px;border-left:4px solid var(--nv);margin-bottom:5px;break-after:avoid}
.sheet .sol{break-inside:avoid;padding:4px 2px 6px;border-bottom:1px dotted #9aa9c4}.sheet .solh{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.sheet .soln{display:inline-block;min-width:1.7em;text-align:center;background:var(--nv);color:#fff;border-radius:4px;padding:0 4px}.sheet .sola{font-size:11.5pt;color:var(--nv2)}
.sheet .solt{font-size:8pt;border:1px solid #9aa9c4;border-radius:99px;padding:0 7px;color:#33466b;font-weight:700}
.sheet .sev{color:#5b4a2a;background:#f6efe3;border-radius:4px;padding:1px 6px;margin-top:2px}.sheet .swr{color:#444;margin-top:2px}
.sheet .ssol{background:#f2f5fb;border:1px solid #c5d2ea;border-radius:6px;padding:8px 10px;margin:0 0 18px}.sheet .ssolh{font-weight:800;color:var(--nv2);margin-bottom:3px}
/* 교재: 표지·차례 */
.sheet .cover{break-after:page;min-height:230mm;display:flex;flex-direction:column;justify-content:center;font-family:"Pretendard Variable",sans-serif;border-left:10px solid var(--nv);padding-left:22px}
.sheet .cover .ck{font-size:9pt;font-weight:800;letter-spacing:.25em;color:var(--gd)}.sheet .cover h1{font-size:30pt;margin:6px 0 4px;color:var(--nv2);letter-spacing:-.03em;line-height:1.2}.sheet .cover p{margin:0 0 26px;color:#444}
.sheet .toc{list-style:none;padding:0;margin:0;max-width:150mm;counter-reset:t}.sheet .toc li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted #9aa9c4;padding:4px 0;counter-increment:t}
.sheet .toc li span::before{content:counter(t,decimal-leading-zero) "  ";color:var(--gd);font-weight:800}.sheet .toc i{font-style:normal;color:#555;white-space:nowrap}
.sheet .bset{font-family:"Pretendard Variable",sans-serif;font-size:12pt;color:var(--nv2);margin:0 0 6px;column-span:all;display:flex;justify-content:space-between;align-items:baseline;border-left:4px solid var(--gd);padding-left:8px}.sheet .bset span{font-size:8.5pt;color:#555;font-weight:500}
.sheet-preview{max-width:880px;overflow:auto;padding:26px 30px}
.pvtabs{display:flex;gap:.6rem;align-items:baseline;margin:.2rem 0 .5rem}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem}
.form{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.7rem .85rem;display:flex;flex-direction:column;gap:.15rem}
.form b{font-size:.95rem;color:var(--brand-3)}.form span{font-size:.78rem;color:var(--muted)}
.form.on{border-color:var(--brand-2);background:var(--brand-50);box-shadow:inset 0 0 0 1px var(--brand-2)}
.shrow{padding:.15rem 0;border-bottom:1px solid var(--line-2)}.shitems{display:flex;flex-wrap:wrap;gap:.25rem;padding:0 0 .35rem 1.6rem}
.vsep{width:1px;height:22px;background:var(--line);margin:0 .2rem}
#print-root{display:none}
@media print{
  @page{size:A4;margin:13mm 11mm 14mm}
  @page{@bottom-center{content:counter(page);font-size:9pt;font-family:sans-serif}}
  body{background:#fff}#layout,#toast,#busy{display:none !important}#print-root{display:block}
}
/* 시험지 보관함 · 대시보드 · 난도 */
#gsearch{width:min(340px,42vw);font-weight:400;padding:.4rem .7rem;font-size:.86rem;background:var(--brand-50);border-color:transparent}
#gsearch:focus{background:#fff}
.facet{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;margin-bottom:.45rem}.facet>b{font-size:.76rem;color:var(--muted);width:3.4rem;flex:0 0 auto}
.cal{border-collapse:collapse;width:100%;font-size:.8rem}.cal th{background:var(--brand-50);color:var(--brand-3);padding:.35rem .3rem;font-weight:700;white-space:nowrap}
.cal td{border-top:1px solid var(--line-2);padding:.3rem .25rem;vertical-align:top;min-width:64px}.cal td.y{font-weight:800;color:var(--brand-3);white-space:nowrap}
.cal .ex{display:block;border-radius:7px;padding:.12rem .4rem;margin:.1rem 0;background:var(--brand-100);color:var(--brand-3);font-weight:700;cursor:pointer;white-space:nowrap;border:0;font-size:.76rem;text-align:left;width:100%}
.cal .ex:hover{background:var(--brand-200)}.cal .ex.k1{background:var(--gold-soft);color:#6b4f1d}.cal .ex.k2{background:#dbe7fb}.cal .ex small{font-weight:500;opacity:.75}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;margin-bottom:1rem}.dgrid .card{margin:0}
.bar{display:flex;align-items:center;gap:.5rem;font-size:.8rem;margin:.18rem 0}.bar>span{width:5.2rem;flex:0 0 auto;color:var(--ink-2)}.bar>i{height:.7rem;border-radius:99px;background:var(--brand);display:block;min-width:2px}.bar>b{font-weight:700;color:var(--brand-3)}
.bar.w>span{width:11rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar.w>i{max-width:38%}
.todo{display:flex;justify-content:space-between;gap:.5rem;padding:.4rem .1rem;border-bottom:1px solid var(--line-2);font-size:.9rem;cursor:pointer}.todo:hover{background:var(--line-2)}.todo b{color:var(--brand-2)}
.dchip{font-weight:800;border-radius:99px;padding:.05rem .5rem;font-size:.74rem;white-space:nowrap;border:1px solid transparent;display:inline-flex;align-items:center}
.d1{background:#e8f5ee;color:#17603b}.d2{background:#eef6e0;color:#4a6b12}.d3{background:#fdf3d7;color:#8a5a00}.d4{background:#fde5d4;color:#a5420b}.d5{background:#fbdada;color:#a01c1c}
.more{display:block;margin:.8rem auto 0}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--brand-2);color:#fff;padding:.6rem 1.1rem;border-radius:99px;font-size:.88rem;font-weight:700;z-index:100;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:92vw}
#busy{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:#111827;color:#fff;padding:.5rem .9rem;border-radius:10px;display:none;align-items:center;gap:.7rem;font-size:.86rem}
@media(max-width:900px){
  #sidebar{position:fixed;left:-260px;z-index:30;transition:left .2s}#sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.25)}
  #menu-btn{display:inline-block} main{padding:1rem} .split{grid-template-columns:1fr} .passage{position:static;max-height:none}
}
</style>
</head>

  <aside id="sidebar">
    <div class="brand"><span class="logo">SP</span><span>스터디피크 국어 랩<small>MY KOREAN LAB</small></span></div>
    <nav id="sbnav">
      <button data-view="dash">대시보드</button>
      <button data-view="exams">시험지 보관함 <span class="cnt" id="n-exams">0</span></button>
      <button data-view="passages">지문·작품 <span class="cnt" id="n-passages">0</span></button>
      <button data-view="upload">시험지 올리기</button>

      <button data-view="variant">변형 만들기</button>
      <button data-view="sheet">출력·교재 만들기</button>
      <button data-view="data">백업·설정</button>
    </nav>
    <div class="sb-foot"><a href="../lab/">수학 랩으로 →</a><br>데이터는 이 브라우저에만 저장됩니다.</div>
  </aside>
  <div id="mainwrap">
    <header id="topbar"><button id="menu-btn" aria-label="메뉴">☰</button><span id="topbar-title">대시보드</span><span style="flex:1"></span><input id="gsearch" type="search" placeholder="🔍 시험·작품·작가·문항 통합 검색 (Enter)" aria-label="통합 검색"></header>
    <main>
      <section class="view" id="view-dash"></section>
      <section class="view" id="view-exams"></section>
      <section class="view" id="view-search"></section>
      <section class="view" id="view-passages"></section>
      <section class="view" id="view-set"></section>
      <section class="view" id="view-upload"></section>
      <section class="view" id="view-items"></section>
      <section class="view" id="view-export"></section>
      <section class="view" id="view-variant"></section>
      <section class="view" id="view-sheet"></section>
      <section class="view" id="view-data"></section>
    </main>
  </div>
</div>
<div id="busy"><span id="busy-label">작업 중…</span><button class="btn sm ghost" onclick="SPAI.cancel()">⏹ 중지</button></div>
